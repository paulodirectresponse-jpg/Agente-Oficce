name: Phase A Desktop Gate

on:
  push:
    branches:
      - feat/experience-v2-universal-api
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-desktop:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Build client and server
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Tauri desktop build
        run: npm run tauri:build

      - name: Smoke packaged runtime lifecycle
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/agent-office.exe"
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6

          $app.Refresh()
          if ($app.HasExited) {
            throw "Packaged Agent Office exited during startup (code $($app.ExitCode))"
          }

          $backend = Get-CimInstance Win32_Process |
            Where-Object { $_.ParentProcessId -eq $app.Id -and $_.Name -eq "node-runtime.exe" } |
            Select-Object -First 1

          if (-not $backend) {
            Get-CimInstance Win32_Process |
              Where-Object { $_.ParentProcessId -eq $app.Id } |
              Format-Table ProcessId, ParentProcessId, Name, CommandLine
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw "Bundled backend process did not start"
          }

          Write-Host "Desktop process: $($app.Id); backend process: $($backend.ProcessId)"
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 3

          if (Get-Process -Id $backend.ProcessId -ErrorAction SilentlyContinue) {
            Stop-Process -Id $backend.ProcessId -Force -ErrorAction SilentlyContinue
            throw "Bundled backend remained orphaned after desktop exit"
          }

      - name: Verify MSI exists
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI was not generated" }
          if ($msi.Length -le 0) { throw "MSI is empty" }
          Write-Host "MSI: $($msi.FullName) ($($msi.Length) bytes)"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: agent-office-phase-a-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
